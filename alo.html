<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
  <h2>Birkin Bag Donation Form:</h2>

<form method="get" action="anotherone.html">

 <label for="username">Name:</label>
 <input type="text" id="username" name="username" placeholder="Your Name">
 <br>

 <label for="useremail">Email:</label>
 <input type="email" id="useremail" name="useremail" placeholder="Your Email">
 <br>

 <label for="donation">Tier:</label>
 <select id="donation" name="donation">
 <option value="Small">Small Donation</option>
 <option value="Medium">Medium Donation</option>
 <option value="Birkin Level">Birkin Level</option>
 </select>
 <br>

 <label for="usernote">Note:</label>
 <textarea name="usernote" id="usernote" cols="44" rows="5"></textarea>
 <br>

 <input type="submit" value="SUBMIT">

</form>
    
</body>
</html>
