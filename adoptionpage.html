<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <h2>Puppy Adoption Page</h2>
<h3>Please enter your information to adopt a puppy and we'll email you back.</h3>
<p> Please Note: First Name, Last Name, Password, and Email are required</p>

<label for="username">First Name:</label>
 <input type="text" id="username" name="username" placeholder="First Name">
 <br>

<label for="username">Last Name:</label>
 <input type="text" id="username" name="username" placeholder="Last Name">
 <br>

 <label for="useremail">Email:</label>
 <input type="email" id="useremail" name="useremail" placeholder="name@email.com">
 <br>

 <label for="userpassword">Password:</label>
<input type="password" id="user-password" name="password">
 <br>

 <p> Are you over the age of 18?</p>

  
  
  <input type="radio" id="Yes" name="agreement" value="yes">
  <label for="yes">Yes</label>
    <input type="radio" id="no" name="agreement" value="no">
  <label for="no">No</label>

  <p>Do you have a Credit Card or PayPal?</p>

 <label for="Pay"></label>
 <select id="Pay" name="Pay">
 <option value="Small">Credit Card</option>
 <option value="Medium">PayPal</option>

 </select>
 <button type="Submit Feedback">Submit</button>
 <br>

</body>
</html>
